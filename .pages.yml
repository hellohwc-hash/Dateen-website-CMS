media:
  input: src/photos
  output: /photos

content:
  - name: site
    label: Site Settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: phone, label: "Phone (display, e.g. 012-201 5578)", type: string }
      - { name: phoneIntl, label: "Phone (international, e.g. +60 12-201 5578)", type: string }
      - { name: whatsapp, label: "WhatsApp number (digits only, e.g. 60122015578)", type: string }
      - { name: email, label: "Email", type: string }
      - { name: address, label: "Address", type: string }
      - { name: hoursWeekday, label: "Opening hours (weekday)", type: string }
      - { name: hoursSat, label: "Opening hours (Saturday)", type: string }
      - { name: instagram, label: "Instagram handle (no @)", type: string }
      - { name: freeDeliveryMin, label: "Free delivery minimum (e.g. RM50)", type: string }
      - name: stats
        label: "Homepage stats"
        type: object
        fields:
          - { name: years, label: "Years in service", type: string }
          - { name: accounts, label: "Corporate accounts", type: string }
          - { name: lines, label: "Service lines", type: string }
          - { name: pax, label: "Pax per event", type: string }
      - name: banners
        label: "Page banner images"
        type: object
        fields:
          - { name: catering, label: "Catering Service banner", type: image }
          - { name: bento, label: "Bento Menu banner", type: image }
          - { name: bungkus, label: "Bungkus Supply banner", type: image }
          - { name: vegetarian, label: "Vegetarian Catering banner", type: image }
          - { name: coldbrew, label: "Cold Brew visual (Bento page)", type: image }

  - name: prices
    label: Prices
    type: file
    path: src/_data/prices.json
    format: json
    fields:
      - { name: bentoFrom, label: "Bento from (RM)", type: string }
      - { name: valueMeal, label: "Value meal each (RM)", type: string }
      - { name: vegBento, label: "Vegetarian bento each (RM)", type: string }
      - { name: coldbrewAmericano, label: "Cold Brew Americano (RM)", type: string }
      - { name: coldbrewLatte, label: "Cold Brew Latte (RM)", type: string }
      - { name: bungkusReseller, label: "Bungkus reseller each (RM)", type: string }
      - { name: cateringFullDayA, label: "Catering Full Day A (RM/pax)", type: string }
      - { name: cateringFullDayB, label: "Catering Full Day B (RM/pax)", type: string }
      - { name: cateringFullDayC, label: "Catering Full Day C, Western (RM/pax)", type: string }
      - { name: cateringLunchLocal, label: "Lunch & Dinner, Local from (RM/pax)", type: string }
      - { name: cateringLunchWestern, label: "Lunch & Dinner, Western from (RM/pax)", type: string }
      - { name: cateringTeaLocal, label: "Tea Break, Local from (RM/pax)", type: string }
      - { name: cateringTeaWestern, label: "Tea Break, Western from (RM/pax)", type: string }

  - name: clients
    label: Client List
    type: file
    path: src/_data/clients.json
    format: json
    fields:
      - name: trusted
        label: "Trusted-by band (homepage top strip)"
        type: string
        list: true
      - name: wall
        label: "Client wall (full grid)"
        type: string
        list: true

  - name: gallery
    label: Catering Gallery
    type: file
    path: src/_data/gallery.json
    format: json
    fields:
      - name: catering
        label: "Gallery photos"
        type: object
        list: true
        fields:
          - { name: image, label: "Photo", type: image }
          - { name: caption, label: "Caption", type: string }
          - { name: tag, label: "Tag (shown in italics)", type: string }
